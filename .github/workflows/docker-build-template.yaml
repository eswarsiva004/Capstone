name: Docker Build Template

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for CI
        type: string
        required: false
        default: "22"
      publish-image:
        description: Build and publish an image to GHCR
        type: boolean
        required: false
        default: false
      image-name:
        description: GHCR image name without registry prefix
        type: string
        required: false
        default: ""
    outputs:
      image-digest:
        description: Published container image digest
        value: ${{ jobs.container.outputs.digest }}

permissions:
  contents: read

jobs:
  # quality:
  #   name: Lint, test, and build
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Check out source
  #       uses: actions/checkout@v4
  #     - name: Prepare Node project
  #       uses: ./.github/actions/setup-node-project
  #       with:
  #         node-version: ${{ inputs.node-version }}
  #     - run: npm run lint
  #     - run: npm test
  #     - run: npm run build
  #     - name: Upload application artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: application-dist
  #         path: dist/
  #         if-no-files-found: error

  container:
    name: Build and publish image
    # needs: quality
    if: ${{ inputs.publish-image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
